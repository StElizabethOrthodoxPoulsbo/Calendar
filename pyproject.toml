[project]
name = "newsletter-calendar"
version = "0.1.0"
description = "Export a public Google Calendar's next month to a newsletter PDF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "icalendar==7.3.0",
    "recurring-ical-events==3.8.2",
    "reportlab==5.1.0",
]

[project.scripts]
newsletter-calendar = "newsletter_calendar:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
newsletter_calendar = ["assets/*.png"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pypdf>=6,<7",
]
