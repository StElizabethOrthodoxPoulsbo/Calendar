name: Generate parish calendar PDF

on:
  schedule:
    - cron: '0 9 21 * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (YYYY-MM); leave empty for next month in America/Los_Angeles'
        required: false
        type: string
      calendar_url:
        description: 'Public HTTPS iCal URL (never a private/secret address)'
        required: true
        default: 'https://calendar.google.com/calendar/ical/hardin.ws_fm73fv8u5c49ki9kc9infr3jic%40group.calendar.google.com/public/basic.ics'
        type: string
      send_email:
        description: 'Also email the PDF using the configured Gmail account and recipients'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_CALENDAR_URL: ${{ inputs.calendar_url }}
      CALENDAR_MONTH: ${{ inputs.month }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: go-task/setup-task@v1
      - name: Check regression coverage
        run: task test
      - name: Resolve publication month
        run: |
          uv run --locked python - <<'PY'
          import os
          from zoneinfo import ZoneInfo
          from newsletter_calendar import publication_month

          month = publication_month(os.environ.get("CALENDAR_MONTH"), ZoneInfo("America/Los_Angeles"))
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"CALENDAR_MONTH={month:%Y-%m}\n")
          PY
      - name: Generate the same PDF as local development
        run: task dev
      - uses: actions/upload-artifact@v4
        with:
          name: parish-calendar-pdf
          path: dist/calendar.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Email the generated PDF
        if: success() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_email))
        run: uv run --locked python -m newsletter_calendar.delivery --attachment dist/calendar.pdf --month "$CALENDAR_MONTH"
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CALENDAR_EMAIL_RECIPIENTS: ${{ secrets.CALENDAR_EMAIL_RECIPIENTS }}
